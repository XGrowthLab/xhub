name: Docker and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 发布任务按 ref 排队，避免推送镜像后被取消而缺失 Release。
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test scripts/test_release_workflow.cjs
      - run: node --test scripts/test_dependabot.cjs frontend/e2e/checklist-reporter.test.cjs frontend/e2e/gateway-response.test.cjs frontend/e2e/guard-resource-cleanup.test.cjs frontend/e2e/guard-resource-fixture.test.cjs
      - run: python3 -m unittest scripts.test_deploy_build -v
      # 真实慢读客户端验证专用Nginx配置，旧2秒对照必须断流；不通过增加测试时限掩盖问题。
      - run: python3 -m unittest scripts.test_nginx_slow_client -v
      - run: python3 -m unittest scripts.test_regression_output scripts.test_makefile scripts.test_regression_results scripts.test_test_gates scripts.test_e2e_summary scripts.test_e2e_model_endpoints -v
      # 隔离回归夹具在随机端口启动本机 Redis，Compose 服务不能替代 redis-server 二进制。
      - name: Install regression Redis
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          redis-server --version
      # 本地配置不入库；干净 checkout 从已跟踪的示例生成测试所需配置。
      - name: Prepare test configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f configs/config.yaml ]]; then
            cp configs/config.example.yaml configs/config.yaml
          fi
      # 回归夹具放在 cmd 下，但其签名/加密单元测试仍需进入发布门禁。
      - run: docker compose up -d --wait postgres redis
      - run: go test ./internal/... ./cmd/regression/testsupport/...
      # 固定真实 CLI 版本，离线协议夹具验证文件工具往返；不使用生产供应商凭据。
      - name: Install agent compatibility clients
        run: |
          npm install --prefix .e2e/agent-clients --no-audit --no-fund @openai/codex@0.163.0 @anthropic-ai/claude-code@2.1.300
          .e2e/agent-clients/node_modules/.bin/codex --version
          .e2e/agent-clients/node_modules/.bin/claude --version
      # 完整回归日志落盘，失败只展示最后 16 KiB，避免 Actions 截断步骤日志。
      - name: Backend regression
        shell: bash
        env:
          XHUB_TEST_CODEX_BIN: ${{ github.workspace }}/.e2e/agent-clients/node_modules/.bin/codex
          XHUB_TEST_CLAUDE_BIN: ${{ github.workspace }}/.e2e/agent-clients/node_modules/.bin/claude
          XHUB_AGENT_REPORT_DIR: ${{ github.workspace }}/.e2e/release/agent-clients
        run: |
          set -euo pipefail
          mkdir -p .e2e/release
          if bash scripts/regression.sh -v > .e2e/release/regression.log 2>&1; then
            echo 'Backend regression passed. Full log: release-test-results/regression.log'
          else
            status=$?
            echo 'Backend regression failed. Last 16 KiB follow; full log: release-test-results/regression.log'
            tail -c 16384 .e2e/release/regression.log
            exit "$status"
          fi
      - name: Console HTTP compatibility unit tests
        working-directory: frontend
        run: |
          npx vitest run --project unit tests/dependency-compat.test.ts
          npx vitest run --project unit tests/proxy-config.test.ts
          npx vitest run --project unit src/lib/http/resolveApiBase.test.ts src/lib/http/runtime.test.ts src/lib/http/api.test.ts src/utils/randomId.test.ts src/components/networking.test.ts
          npx vitest run --project component 'src/app/(dashboard)/playground/hooks/useChatHistory.test.ts'
          npx vitest run --project unit src/components/add_model/modelEditorPricing.test.ts
          npx vitest run --project component src/components/add_model/ModelEditor.test.tsx
          npx vitest run --project unit src/lib/http/client.test.ts
          npx vitest run --project component src/components/common_components/BudgetReconciliation.test.tsx src/components/templates/key_info_view.test.tsx
          npx vitest run --project unit src/lib/enterpriseSSO.test.ts src/lib/http/enterprise.test.ts
          npx vitest run --project component src/components/Settings/AdminSettings/EnterpriseConfiguration.test.tsx src/components/Settings/AdminSettings/EnterpriseConfiguration.saml.test.tsx src/components/Settings/AdminSettings/SAMLRefresh.test.tsx src/components/Settings/AdminSettings/IntegrationOverview.test.tsx
          npx vitest run --project component src/components/Settings/AdminSettings/VersionUpdates.test.tsx
          npx vitest run --project unit src/lib/http/versionUpdates.test.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # 真实登录、密钥轮换、推理及旧库升级后的日志/用量/监控；使用专属 Redis 和本地上游，运行器清理资源。
      - run: bash scripts/e2e.sh scenarios/legacy/login/sc-056.test.ts cache-price-diagnostics-en.test.ts cache-price-diagnostics-zh-CN.test.ts scenarios/permissions/log-options-en.test.ts scenarios/permissions/log-options-zh-CN.test.ts scenarios/keys/rotation-secret.test.ts scenarios/legacy/playground-workspace/sc-109.test.ts scenarios/regression/usage-upgrade-en.test.ts scenarios/regression/usage-upgrade-zh-CN.test.ts agent-native-protocol.test.ts portable-reasoning.test.ts vision-input.test.ts messages-reasoning.test.ts agent-chat-bridge.test.ts responses-item-ids.test.ts chat-encrypted-reasoning.test.ts agent-proxy-timeout.test.ts web-search-policy.test.ts scenarios/regression/model-monitor-tps-en.test.ts scenarios/regression/model-monitor-tps-zh-CN.test.ts scenarios/permissions/model-monitor-en.test.ts scenarios/permissions/model-monitor-zh-CN.test.ts scenarios/regression/organization-config-en.test.ts scenarios/regression/organization-config-zh-CN.test.ts scenarios/regression/organization-management-en.test.ts scenarios/regression/organization-management-zh-CN.test.ts scenarios/regression/usage-error-en.test.ts scenarios/regression/usage-error-zh-CN.test.ts scenarios/regression/log-cost-reasoning-en.test.ts scenarios/regression/log-cost-reasoning-zh-CN.test.ts scenarios/regression/swagger-reference-en.test.ts scenarios/regression/swagger-reference-zh-CN.test.ts scenarios/columns/search-tools-connection.test.ts scenarios/regression/search_tools-probe-en.test.ts scenarios/columns/prompts-test.test.ts scenarios/regression/prompts-probe-en.test.ts scenarios/regression/guard-management-service-en.test.ts scenarios/regression/guard-management-service-zh-CN.test.ts scenarios/regression/tag-catalog-en.test.ts scenarios/regression/tag-catalog-zh-CN.test.ts scenarios/regression/metadata-config-service-en.test.ts scenarios/regression/metadata-config-service-zh-CN.test.ts scenarios/regression/budget-iam-en.test.ts scenarios/regression/budget-iam-zh-CN.test.ts scenarios/regression/operations-boundary-en.test.ts scenarios/regression/operations-boundary-zh-CN.test.ts scenarios/columns/caching-save.test.ts scenarios/columns/caching-flush.test.ts scenarios/regression/server-oauth-en.test.ts scenarios/regression/server-oauth-zh-CN.test.ts scenarios/regression/server-runtime-en.test.ts scenarios/regression/server-runtime-zh-CN.test.ts scenarios/regression/server-submission-en.test.ts scenarios/regression/server-submission-zh-CN.test.ts scenarios/regression/plugin-activation-en.test.ts scenarios/regression/plugin-activation-zh-CN.test.ts scenarios/regression/plugin-filter-en.test.ts scenarios/regression/plugin-filter-zh-CN.test.ts scenarios/regression/plugin-registration-en.test.ts scenarios/regression/plugin-registration-zh-CN.test.ts scenarios/regression/skill-resource-en.test.ts scenarios/regression/skill-resource-zh-CN.test.ts scenarios/regression/skill-hub-support-en.test.ts scenarios/regression/skill-hub-support-zh-CN.test.ts scenarios/regression/key-basic-edit-en.test.ts scenarios/regression/key-basic-edit-zh-CN.test.ts scenarios/regression/legacy-inference-en.test.ts scenarios/regression/legacy-inference-zh-CN.test.ts scenarios/regression/provider-batch-en.test.ts scenarios/regression/provider-batch-zh-CN.test.ts scenarios/regression/medical-alias-en.test.ts scenarios/regression/medical-alias-zh-CN.test.ts scenarios/regression/service-aux-en.test.ts scenarios/regression/service-aux-zh-CN.test.ts scenarios/regression/identity-alias-en.test.ts scenarios/regression/identity-alias-zh-CN.test.ts scenarios/regression/runtime-operation-en.test.ts scenarios/regression/runtime-operation-zh-CN.test.ts scenarios/regression/settings-operation-en.test.ts scenarios/regression/settings-operation-zh-CN.test.ts scenarios/regression/model-alias-en.test.ts scenarios/regression/model-alias-zh-CN.test.ts scenarios/regression/analytics-boundary-en.test.ts scenarios/regression/analytics-boundary-zh-CN.test.ts scenarios/regression/protocol-boundary-en.test.ts scenarios/regression/protocol-boundary-zh-CN.test.ts scenarios/regression/discovery-boundary-en.test.ts scenarios/regression/discovery-boundary-zh-CN.test.ts scenarios/regression/stage4-combined-en.test.ts scenarios/regression/stage4-combined-zh-CN.test.ts
        env:
          E2E_RUN_DIR: ${{ github.workspace }}/.e2e/release
          E2E_PORTABLE_CONSOLE: '1'
          E2E_REDIS: '1'
          # 该步骤运行发布验收子集；完整清单由专门的全量任务负责，避免把子集误判成全量失败。
          E2E_FULL_COVERAGE: '0'
      # 独立无 Redis 链验证 PostgreSQL 待结算恢复，并覆盖 Agent 历史、流终态、取消、文档和 Key 生命周期。
      - name: API client reliability browser regression
        run: bash scripts/e2e.sh scenarios/legacy/error-logs/sc-020.test.ts scenarios/regression/personal-log-capture- proxy-body-limit.test.ts client-docs-url- client-cancellation- stream-terminal-sc- upstream-stream-errors- billing-pending-recovery usage-spool- key-lifecycle- agent-history- model-view- hard-budget- budget-reconciliation- messages-signed-history- claude-client-compat- user-bulk-budget- scenarios/enterprise/saml- scenarios/enterprise/sso-valid.test.ts scenarios/directory/sso-config.test.ts compact-history-account-canary.test.ts diagnostic-storage.test.ts
        env:
          E2E_RUN_DIR: ${{ github.workspace }}/.e2e/release-agent-reliability
          E2E_BUILD_DIR: .next-agent-reliability
          E2E_PORTABLE_CONSOLE: '1'
          E2E_REDIS: '0'
          # 第一组仍验证全量压缩。此组验证名单内外账号采用不同的历史写入格式。
          XHUB_COMPACT_HISTORY: canary
          XHUB_COMPACT_HISTORY_USER_IDS: history-canary-en,history-canary-zh-cn
          # 该步骤同样只运行可靠性子集，不能要求覆盖全部业务清单。
          E2E_FULL_COVERAGE: '0'
      - name: Host update state and manifest tests
        run: python3 -B -m unittest deploy.test_update_agent deploy.test_publish_release deploy.test_install -v
      - name: Version update browser regression
        run: python3 -B e2e/version_update_fixture.py
        env:
          E2E_RUN_DIR: ${{ github.workspace }}/.e2e/release-version-update
          E2E_BUILD_DIR: .next-version-update
          E2E_FULL_COVERAGE: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: |
            .e2e/release/regression.log
            .e2e/release/agent-clients/
            .e2e/runs/regression-*/regression.log
            .e2e/runs/regression-*/events.jsonl
            .e2e/runs/regression-*/summary.json
            .e2e/release/results.json
            .e2e/release/junit.xml
            .e2e/release/cleanup-status.json
            .e2e/release/cleanup.log
            .e2e/release/scenario-coverage.json
            .e2e/release/html/
            .e2e/release/test-results/
            .e2e/release-agent-reliability/results.json
            .e2e/release-agent-reliability/junit.xml
            .e2e/release-agent-reliability/cleanup-status.json
            .e2e/release-agent-reliability/cleanup.log
            .e2e/release-agent-reliability/scenario-coverage.json
            .e2e/release-agent-reliability/html/
            .e2e/release-agent-reliability/test-results/
            .e2e/release-version-update/results.json
            .e2e/release-version-update/junit.xml
            .e2e/release-version-update/cleanup-status.json
            .e2e/release-version-update/test-results/
          if-no-files-found: ignore
      - run: docker compose down -v
        if: always()

  verify_install:
    name: Default Linux installation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build local Compose images
        run: |
          install -D "$(command -v node)" bin/node-linux-amd64
          bash deploy/build.sh
          # 模拟同一提交的非发布镜像。临时容器只用于写构建标签，随后销毁。
          for service in gateway console; do
            image="xhub-$service"
            holder=$(docker create "$image")
            docker commit --change 'LABEL org.opencontainers.image.version=main' \
              --change "LABEL org.opencontainers.image.revision=$GITHUB_SHA" "$holder" "$image"
            docker rm "$holder"
          done
        env:
          XHUB_GATEWAY_ORIGIN: http://gateway:4000
      - name: Install and check version updates
        env:
          XHUB_RELEASE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .e2e/default-install
          # 令牌只用于真实发布读取，避免共享 runner 的匿名 API 限额。
          printf 'XHUB_RELEASE_TOKEN=%s\n' "$XHUB_RELEASE_TOKEN" |
            sudo sh -c 'umask 077; cat > /etc/xhub-updater.env'
          unset XHUB_RELEASE_TOKEN
          sudo python3 -B deploy/install.py
          sudo systemctl is-enabled xhub-updater.service
          sudo systemctl is-active xhub-updater.service
          before=$(sudo docker compose -f /opt/xhub/docker-compose.yml ps -q)
          sudo python3 -B deploy/install.py
          test "$before" = "$(sudo docker compose -f /opt/xhub/docker-compose.yml ps -q)"
          E2E_BUILD_REVISION="$GITHUB_SHA" node e2e/default_version_update_browser.cjs http://127.0.0.1:3000 http://127.0.0.1:4000 |
            tee .e2e/default-install/browser-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: default-install-results
          path: .e2e/default-install/
          if-no-files-found: ignore
      - name: Remove the isolated install
        if: always()
        run: |
          sudo systemctl disable --now xhub-updater.service || true
          if sudo test -f /opt/xhub/docker-compose.yml; then
            sudo docker compose -f /opt/xhub/docker-compose.yml down -v
          fi
          sudo rm -rf /opt/xhub /var/lib/xhub-updater /run/xhub-updater
          sudo rm -f /etc/xhub-updater.env /etc/systemd/system/xhub-updater.service

  publish:
    needs: [verify, verify_install]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ref 通过环境传入，禁止将不可信标签直接插入 shell 代码。
      - name: Validate version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
              echo 'Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N (also alpha/beta).' >&2
              exit 1
            fi
          fi
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
      - name: Plan tagged release
        id: release_plan
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        # 写入输出前先完整查询 Release。查询失败时整个发布作业失败。
        run: python3 -B deploy/publish_release.py plan >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
        working-directory: frontend
      - run: npm run build
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          XHUB_GATEWAY_ORIGIN: http://gateway:4000
      # tracingRoot 是仓库根目录，保留 standalone 的 frontend 子目录和 docs 资源。
      - name: Prepare runtime artifacts
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p bin/console/frontend/.next
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o bin/xhub-linux-amd64 ./cmd/gateway
          cp /etc/ssl/certs/ca-certificates.crt bin/ca-certificates.crt
          test -f frontend/.next/standalone/frontend/server.js
          cp -a frontend/.next/standalone/. bin/console/
          cp -a frontend/.next/static bin/console/frontend/.next/static
          cp -a frontend/public bin/console/frontend/public
      - uses: docker/setup-buildx-action@v3
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: github.ref_type != 'tag' || steps.release_plan.outputs.registry == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute database compatibility
        id: compatibility
        run: |
          set -euo pipefail
          fingerprint=$(python3 deploy/update_manifest.py fingerprint)
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: gateway
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
        with:
          images: ghcr.io/${{ steps.version.outputs.repository }}-gateway
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
          flavor: latest=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/metadata-action@v5
        id: console
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
        with:
          images: ghcr.io/${{ steps.version.outputs.repository }}-console
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
          flavor: latest=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        id: gateway_image
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
        with:
          context: .
          file: Dockerfile
          target: gateway
          platforms: linux/amd64
          push: true
          tags: ${{ steps.gateway.outputs.tags }}
          labels: |
            ${{ steps.gateway.outputs.labels }}
            io.xhub.database-compatibility=${{ steps.compatibility.outputs.fingerprint }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - uses: docker/build-push-action@v6
        id: console_image
        if: github.ref_type != 'tag' || steps.release_plan.outputs.build == 'true'
        with:
          context: .
          file: deploy/Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.console.outputs.tags }}
          labels: |
            ${{ steps.console.outputs.labels }}
            io.xhub.database-compatibility=${{ steps.compatibility.outputs.fingerprint }}
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console
      # 仅新标签会构建镜像。既有版本只校验固定摘要或补齐缺失附件。
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          GATEWAY_DIGEST: ${{ steps.gateway_image.outputs.digest }}
          CONSOLE_DIGEST: ${{ steps.console_image.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
          DATABASE_COMPATIBILITY: ${{ steps.compatibility.outputs.fingerprint }}
        run: python3 -B deploy/publish_release.py publish
